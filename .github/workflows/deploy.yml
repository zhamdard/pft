# ============================================================
#  Deploy PFT to GitHub Pages
#  ------------------------------------------------------------
#  Every push to "main" builds the app, runs the tests, and
#  publishes it to   https://<your-username>.github.io/<repo>/
#
#  One-time setup (details in docs/DEPLOY_GITHUB.md):
#    Settings → Pages → Build and deployment → Source = "GitHub Actions"
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run logic tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
