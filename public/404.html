<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PFT — Page not found</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #4f46e5;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 14px;
        margin: 0 0 24px;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 11px 22px;
        border-radius: 12px;
      }
      a:hover {
        background: #4338ca;
      }
    </style>
    <script>
      /*
       * GitHub Pages has no server-side rewrites, so this file is served for
       * any path that doesn't exist. PFT is a single-page app with no URL
       * routes, so the right move is to send people to the app root.
       *
       * The first path segment is the repository name (for project sites like
       * username.github.io/repo/), so we keep it and drop everything after it.
       */
      (function () {
        var segments = window.location.pathname.split('/').filter(Boolean)
        var home = segments.length ? '/' + segments[0] + '/' : '/'
        window.setTimeout(function () {
          window.location.replace(home)
        }, 1200)
      })()
    </script>
  </head>
  <body>
    <div>
      <div class="mark">PFT</div>
      <h1>That page doesn’t exist</h1>
      <p>Taking you back to your finance tracker…</p>
      <a id="home" href="./">Go to PFT now</a>
    </div>
  </body>
</html>
